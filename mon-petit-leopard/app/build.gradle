plugins { id 'com.android.application' }

android {
    namespace 'com.byw.monpetitleopard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.byw.monpetitleopard'
        minSdk 26
        targetSdk 35
        versionCode 56
        versionName '0.8.11'
    }

    sourceSets {
        main {
            // Une zone indépendante par espèce, sexe visuel et âge : aucun sprite de personnage
            // ne reste dans res/drawable-nodpi.
            res.srcDirs = [
                'src/main/res',
                'src/main/res-cub',
                'src/main/res-teen',
                'src/main/res-adult',
                'src/main/res-old',
                'src/main/res-wolf-cub',
                'src/main/res-wolf-teen',
                'src/main/res-wolf-adult',
                'src/main/res-wolf-old',
                'src/main/res-tiger-cub',
                'src/main/res-tiger-teen',
                'src/main/res-tiger-adult',
                'src/main/res-tiger-old',
                'src/main/res-lion-male-cub',
                'src/main/res-lion-male-teen',
                'src/main/res-lion-male-adult',
                'src/main/res-lion-male-old',
                'src/main/res-lion-female-cub',
                'src/main/res-lion-female-teen',
                'src/main/res-lion-female-adult',
                'src/main/res-lion-female-old',
                'src/main/res-fox-cub',
                'src/main/res-fox-teen',
                'src/main/res-fox-adult',
                'src/main/res-fox-old',
                'src/main/res-bear-cub',
                'src/main/res-bear-teen',
                'src/main/res-bear-adult',
                'src/main/res-bear-old'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// All six species share the same game rules; lion packs also preserve the profile's sex.
