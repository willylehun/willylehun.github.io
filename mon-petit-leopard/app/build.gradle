plugins { id 'com.android.application' }

android {
    namespace 'com.byw.monpetitleopard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.byw.monpetitleopard'
        minSdk 26
        targetSdk 35
        versionCode 45
        versionName '0.8.0'
    }

    sourceSets {
        main {
            // Quatre zones physiques indépendantes : aucun sprite de personnage
            // ne reste dans res/drawable-nodpi.
            res.srcDirs = [
                'src/main/res',
                'src/main/res-cub',
                'src/main/res-teen',
                'src/main/res-adult',
                'src/main/res-old'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Character sprite packs physically separated; final v0.8.0 behavior and needs validation.
