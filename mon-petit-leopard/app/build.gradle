plugins { id 'com.android.application' }

android {
    namespace 'com.byw.monpetitleopard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.byw.monpetitleopard'
        minSdk 26
        targetSdk 35
        versionCode 51
        versionName '0.8.6'
    }

    sourceSets {
        main {
            // Une zone indépendante par espèce et par âge : aucun sprite de personnage
            // ne reste dans res/drawable-nodpi.
            res.srcDirs = [
                'src/main/res',
                'src/main/res-cub',
                'src/main/res-teen',
                'src/main/res-adult',
                'src/main/res-old',
                'src/main/res-wolf-cub',
                'src/main/res-wolf-teen',
                'src/main/res-wolf-adult',
                'src/main/res-wolf-old'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Both species use the same game rules and separate, validated sprite packs.
