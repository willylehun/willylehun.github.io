name: Audit Mon Petit Leopard sprite sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mon-petit-leopard-sprite-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record audited revision
        run: git rev-parse HEAD > mon-petit-leopard/AUDIT_REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mon-petit-leopard-sprite-sources
          path: mon-petit-leopard/
          retention-days: 7
