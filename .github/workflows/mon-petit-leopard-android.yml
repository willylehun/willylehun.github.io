name: Build Mon Petit Leopard APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mon-petit-leopard/**'
      - '.github/workflows/mon-petit-leopard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v0.2 source
        run: |
          cat mon-petit-leopard/source-v02/MainActivity.java.gz.b64.part* | tr -d '\r\n ' | base64 -d | gunzip > mon-petit-leopard/app/src/main/java/com/byw/monpetitleopard/MainActivity.java

      - name: Prepare Android assets
        run: |
          set -e
          mkdir -p mon-petit-leopard/app/src/main/res/drawable
          for name in leopard_cub_strip.webp leopard_teen_strip.webp leopard_adult_strip.webp room_living.jpg room_bathroom.jpg; do
            tr -d '\r\n ' < "mon-petit-leopard/assets-v02/$name.b64" | base64 -d > "mon-petit-leopard/app/src/main/res/drawable/$name"
          done
          cat mon-petit-leopard/assets-v02/leopard_old_strip.webp.b64.part* | tr -d '\r\n ' | base64 -d > mon-petit-leopard/app/src/main/res/drawable/leopard_old_strip.webp
          for name in room_kitchen.jpg room_garden.jpg; do
            tr -d '\r\n ' < "mon-petit-leopard/assets/$name.b64" | base64 -d > "mon-petit-leopard/app/src/main/res/drawable/$name"
          done
          file mon-petit-leopard/app/src/main/res/drawable/*

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p mon-petit-leopard assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard.apk

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 downloads/mon-petit-leopard.apk --clobber
          else
            gh release create v0.2.0 downloads/mon-petit-leopard.apk --title "Mon Petit Léopard v0.2.0" --notes "Léopard autonome, besoins, humeurs, bêtises, discipline et compétences."
          fi

      - name: Publish direct-download APK
        run: |
          git pull --rebase
          mkdir -p downloads
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mon-petit-leopard.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publie Mon Petit Leopard APK v0.2.0 [skip ci]"
            git push
          fi
