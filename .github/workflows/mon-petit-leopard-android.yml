name: Build Mon Petit Leopard APK

on:
  push:
    branches: [ main, mon-petit-leopard-v010 ]
    paths:
      - 'mon-petit-leopard/**'
      - '.github/workflows/mon-petit-leopard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android assets
        run: |
          mkdir -p mon-petit-leopard/app/src/main/res/drawable
          python3 - <<'PY'
          import base64, glob, os
          for f in glob.glob("mon-petit-leopard/assets/*.b64"):
              raw = "".join(open(f, encoding="utf-8").read().split())
              raw += "=" * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw)
              name = os.path.basename(f)[:-4]
              out = os.path.join("mon-petit-leopard/app/src/main/res/drawable", name)
              open(out, "wb").write(data)
              print("decoded", name, len(data))
          PY

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p mon-petit-leopard assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-petit-leopard-v0.2.0
          path: mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare downloadable APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard.apk

      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mon-petit-leopard-v0.2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/mon-petit-leopard.apk --clobber
          else
            gh release create "$TAG" downloads/mon-petit-leopard.apk \
              --title "Mon Petit Léopard v0.2.0" \
              --notes "Version Android installable hors Play Store : déplacements autonomes par sprites, besoins, humeurs, bêtises, punitions et compétences."
          fi

      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mon-petit-leopard.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publie Mon Petit Leopard v0.2.0 APK [skip ci]"
            git push
          fi
