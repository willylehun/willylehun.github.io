name: Build Mon Petit Leopard APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mon-petit-leopard/**'
      - '.github/workflows/mon-petit-leopard-android.yml'
  pull_request:
    paths:
      - 'mon-petit-leopard/**'
      - '.github/workflows/mon-petit-leopard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mon-petit-leopard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0 numpy==2.3.3
      - name: Prepare sprite packs
        run: python mon-petit-leopard/tools/prepare_v061_sprite_assets.py
      - name: Prepare salon game assets
        run: python mon-petit-leopard/tools/prepare_v070_game_assets.py
      - name: Prepare bottle and care assets
        run: python mon-petit-leopard/tools/prepare_v075_care_assets.py
      - name: Prepare promenade assets
        run: python mon-petit-leopard/tools/prepare_v076_promenade_assets.py
      - name: Prepare garden scratcher assets
        run: python mon-petit-leopard/tools/prepare_v078_garden_assets.py
      - name: Sprite contract tests
        run: python mon-petit-leopard/tools/test_sprite_contract.py
      - name: Validate sprite packs
        run: python mon-petit-leopard/tools/validate_sprite_packs.py
      - name: Build APK
        run: gradle -p mon-petit-leopard assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-petit-leopard-v0.8.3
          path: mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare downloadable APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard-v0.8.3.apk
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard.apk
      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mon-petit-leopard-v0.8.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/mon-petit-leopard.apk --clobber
          else
            gh release create "$TAG" downloads/mon-petit-leopard.apk \
              --title "Mon Petit Léopard v0.8.3 — Reproduction et profondeur cuisine" \
              --notes "v0.8.3 : la gamelle d’eau reste désormais toujours derrière le léopard. Le menu diagnostic « Vérifier les quatre packs » est retiré du menu joueur et remplacé par Reproduction. Le joueur peut sélectionner deux animaux détenus de la même espèce et de sexes opposés ; si un emplacement sur les 6 est libre, un petit naît dans cet emplacement. Son sexe est déterminé automatiquement à la naissance et le joueur choisit uniquement son nom. Le petit démarre comme léopardeau avec son propre profil, sa propre personnalité et ses propres besoins. Toutes les fonctions v0.8.2 sont conservées."
          fi
      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mon-petit-leopard.apk downloads/mon-petit-leopard-v0.8.3.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publie Mon Petit Leopard v0.8.3 APK [skip ci]"
            git push
          fi
