name: Build Mon Petit Leopard APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mon-petit-leopard/**'
      - '.github/workflows/mon-petit-leopard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate sprite packs
        run: python mon-petit-leopard/tools/validate_sprite_packs.py

      - name: Build APK
        run: gradle -p mon-petit-leopard assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-petit-leopard-v0.5.3
          path: mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare downloadable APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard-v0.5.3.apk
          cp mon-petit-leopard/app/build/outputs/apk/debug/app-debug.apk downloads/mon-petit-leopard.apk

      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mon-petit-leopard-v0.5.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/mon-petit-leopard.apk --clobber
          else
            gh release create "$TAG" downloads/mon-petit-leopard.apk \
              --title "Mon Petit Léopard v0.5.3" \
              --notes "Organisation v0.5.3 : quatre packs de sprites totalement séparés par âge, aucun fallback croisé, 4 frames affichées de façon uniforme pour SIDE/FRONT/BACK, gauche/droite issues du même strip SIDE par miroir uniquement, haut=dos, bas=face, cache visuel vidé au changement d'âge et validation automatique avant build."
          fi

      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mon-petit-leopard.apk downloads/mon-petit-leopard-v0.5.3.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publie Mon Petit Leopard v0.5.3 APK [skip ci]"
            git push
          fi
