name: Assemble CUB face atlas

on:
  push:
    branches: [ main ]
    paths:
      - 'mon-petit-leopard/.face-transfer/**'
      - '.github/workflows/assemble-cub-face.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified face atlas
        run: |
          set -euo pipefail
          test -d mon-petit-leopard/.face-transfer
          cat mon-petit-leopard/.face-transfer/leopard_cub_face_moods.part00               mon-petit-leopard/.face-transfer/leopard_cub_face_moods.part01               mon-petit-leopard/.face-transfer/leopard_cub_face_moods.part02               mon-petit-leopard/.face-transfer/leopard_cub_face_moods.part03             > /tmp/leopard_cub_face_moods.b64
          test "$(wc -c < /tmp/leopard_cub_face_moods.b64)" -eq 50392
          base64 -d /tmp/leopard_cub_face_moods.b64             > mon-petit-leopard/app/src/main/res-cub/drawable-nodpi/leopard_cub_face_moods.webp
          echo "f658bd06425abe67ab06475c8f84399db01e9230b430623f9bdde52ebe577083  mon-petit-leopard/app/src/main/res-cub/drawable-nodpi/leopard_cub_face_moods.webp"             | sha256sum -c -
          test "$(wc -c < mon-petit-leopard/app/src/main/res-cub/drawable-nodpi/leopard_cub_face_moods.webp)" -eq 37794

      - name: Commit atlas and remove transfer payload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mon-petit-leopard/app/src/main/res-cub/drawable-nodpi/leopard_cub_face_moods.webp
          git rm -r mon-petit-leopard/.face-transfer
          git rm .github/workflows/assemble-cub-face.yml
          git commit -m "Restaure les 12 humeurs face du léopardeau [skip ci]"
          git push
